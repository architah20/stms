# Experiment 4: Jenkins with Python + Docker CLI preinstalled
services:
  jenkins:
    build: ./jenkins
    container_name: stms-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
