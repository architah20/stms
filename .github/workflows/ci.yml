# Experiments 5 & 8: CI/CD with GitHub Actions
name: STMS CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: cd app && pytest -v

  docker:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/stms:latest
            ${{ secrets.DOCKER_USERNAME }}/stms:${{ github.sha }}

  deploy:
    name: Deploy to AWS EC2
    needs: docker
    runs-on: ubuntu-latest
    # Turn on later: repo Settings > Variables > Actions > ENABLE_DEPLOY = true
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/stms:latest
            docker stop stms || true
            docker rm stms || true
            docker run -d --name stms -p 5000:5000 -v stms-data:/data ${{ secrets.DOCKER_USERNAME }}/stms:latest
